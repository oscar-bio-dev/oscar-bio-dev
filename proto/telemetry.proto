syntax = "proto3";

package telemetry;

// The single source of truth for the edge-to-cloud payload.
// Shared between the ESP-IDF (C++) firmware and the Rust backend.
message TelemetryPayloadPb {
    // Unique identifier for the hardware node
    string device_id = 1;
    
    // Unix epoch timestamp in milliseconds (UTC)
    int64 timestamp_epoch_ms = 2;
    
    // Water/Soil metrics
    double temperature = 3; // Celsius
    optional double humidity = 4; // % Relative Humidity
    optional double ph = 5; // 0.0 - 14.0
    optional double dissolved_oxygen = 6; // mg/L
    
    // Air Quality metrics (BME688/SCD41)
    optional double pressure = 7; // hPa
    optional double gas_resistance = 8; // Ohms (VOCs)
    optional double co2 = 9; // ppm
}
